name: trazabilidad

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    ports:
      - "3000:3000"
    depends_on:
      - db

  web:
    build: ./web
    ports:
      - "8081:80"

  pwa:
    build: ./pwa
    ports:
      - "8082:80"

volumes:
  pgdata:
